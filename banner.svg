<g id="code"><g><text x="490" y="30" class="cd"><tspan fill="#ff7b72">async</tspan> <tspan fill="#ff7b72">function</tspan> <tspan fill="#d2a8ff">ship</tspan>(pr: PullRequest) {</text><text x="490" y="49" class="cd">  <tspan fill="#ff7b72">const</tspan> review = <tspan fill="#ff7b72">await</tspan> reviewers.<tspan fill="#d2a8ff">request</tspan>(pr);</text><text x="490" y="68" class="cd">  <tspan fill="#ff7b72">if</tspan> (!review.approved) <tspan fill="#ff7b72">return</tspan> <tspan fill="#d2a8ff">iterate</tspan>(pr);</text><text x="490" y="87" class="cd">  <tspan fill="#ff7b72">await</tspan> ci.<tspan fill="#d2a8ff">run</tspan>(pr.branch, { parallel: <tspan fill="#ff7b72">true</tspan> });</text><text x="490" y="106" class="cd">  <tspan fill="#ff7b72">return</tspan> <tspan fill="#d2a8ff">merge</tspan>(pr, { strategy: <tspan fill="#a5d6ff">&quot;squash&quot;</tspan> });</text><text x="490" y="125" class="cd">}</text><text x="490" y="144" class="cd"></text><text x="490" y="163" class="cd"><tspan fill="#ff7b72">def</tspan> <tspan fill="#d2a8ff">train</tspan>(model, data, epochs=<tspan fill="#79c0ff">10</tspan>):</text><text x="490" y="182" class="cd">    <tspan fill="#ff7b72">for</tspan> epoch <tspan fill="#ff7b72">in</tspan> <tspan fill="#d2a8ff">range</tspan>(epochs):</text><text x="490" y="201" class="cd">        loss = model.<tspan fill="#d2a8ff">step</tspan>(data.<tspan fill="#d2a8ff">batch</tspan>())</text><text x="490" y="220" class="cd">        log.<tspan fill="#d2a8ff">info</tspan>(<tspan fill="#a5d6ff">f&quot;epoch {epoch}: {loss:.4f}&quot;</tspan>)</text><text x="490" y="239" class="cd">    <tspan fill="#ff7b72">return</tspan> model</text><text x="490" y="258" class="cd"></text><text x="490" y="277" class="cd"><tspan fill="#ff7b72">export</tspan> <tspan fill="#ff7b72">const</tspan> api = <tspan fill="#d2a8ff">router</tspan>()</text><text x="490" y="296" class="cd">  .<tspan fill="#d2a8ff">get</tspan>(<tspan fill="#a5d6ff">&quot;/health&quot;</tspan>, () =&gt; ({ ok: <tspan fill="#ff7b72">true</tspan> }))</text><text x="490" y="315" class="cd">  .<tspan fill="#d2a8ff">post</tspan>(<tspan fill="#a5d6ff">&quot;/agents/:id/run&quot;</tspan>, runAgent);</text><text x="490" y="334" class="cd"></text><text x="490" y="353" class="cd"><tspan fill="#ff7b72">async</tspan> <tspan fill="#ff7b72">function</tspan> <tspan fill="#d2a8ff">ship</tspan>(pr: PullRequest) {</text><text x="490" y="372" class="cd">  <tspan fill="#ff7b72">const</tspan> review = <tspan fill="#ff7b72">await</tspan> reviewers.<tspan fill="#d2a8ff">request</tspan>(pr);</text><text x="490" y="391" class="cd">  <tspan fill="#ff7b72">if</tspan> (!review.approved) <tspan fill="#ff7b72">return</tspan> <tspan fill="#d2a8ff">iterate</tspan>(pr);</text><text x="490" y="410" class="cd">  <tspan fill="#ff7b72">await</tspan> ci.<tspan fill="#d2a8ff">run</tspan>(pr.branch, { parallel: <tspan fill="#ff7b72">true</tspan> });</text><text x="490" y="429" class="cd">  <tspan fill="#ff7b72">return</tspan> <tspan fill="#d2a8ff">merge</tspan>(pr, { strategy: <tspan fill="#a5d6ff">&quot;squash&quot;</tspan> });</text><text x="490" y="448" class="cd">}</text><text x="490" y="467" class="cd"></text><text x="490" y="486" class="cd"><tspan fill="#ff7b72">def</tspan> <tspan fill="#d2a8ff">train</tspan>(model, data, epochs=<tspan fill="#79c0ff">10</tspan>):</text><text x="490" y="505" class="cd">    <tspan fill="#ff7b72">for</tspan> epoch <tspan fill="#ff7b72">in</tspan> <tspan fill="#d2a8ff">range</tspan>(epochs):</text><text x="490" y="524" class="cd">        loss = model.<tspan fill="#d2a8ff">step</tspan>(data.<tspan fill="#d2a8ff">batch</tspan>())</text><text x="490" y="543" class="cd">        log.<tspan fill="#d2a8ff">info</tspan>(<tspan fill="#a5d6ff">f&quot;epoch {epoch}: {loss:.4f}&quot;</tspan>)</text><text x="490" y="562" class="cd">    <tspan fill="#ff7b72">return</tspan> model</text><text x="490" y="581" class="cd"></text><text x="490" y="600" class="cd"><tspan fill="#ff7b72">export</tspan> <tspan fill="#ff7b72">const</tspan> api = <tspan fill="#d2a8ff">router</tspan>()</text><text x="490" y="619" class="cd">  .<tspan fill="#d2a8ff">get</tspan>(<tspan fill="#a5d6ff">&quot;/health&quot;</tspan>, () =&gt; ({ ok: <tspan fill="#ff7b72">true</tspan> }))</text><text x="490" y="638" class="cd">  .<tspan fill="#d2a8ff">post</tspan>(<tspan fill="#a5d6ff">&quot;/agents/:id/run&quot;</tspan>, runAgent);</text><text x="490" y="657" class="cd"></text><animateTransform attributeName="transform" type="translate" values="0 0;0 -323" dur="24s" repeatCount="indefinite"/></g></g>
